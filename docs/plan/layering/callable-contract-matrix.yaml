    new: arian.infrastructure.retry.execute_with_retry
    kind: function
    async: true
    result: "Result[T]"
    callers: [repository/index/sqlite_repository.py]

  - old: arian.infrastructure.retry.retry_sync_with_backoff
    new: arian.infrastructure.retry.execute_with_retry_sync
    kind: function
    async: false
    result: "Result[T]"
    callers: [infrastructure/file_output_writer.py]

  - old: arian.domain.shared.language.detect_language
    new: arian.domain.shared.language.detect_language
    kind: function
    async: false
    result: str
    callers: [repository/filesystem/collector.py]

  - old: arian.domain.shared.tokenizer.estimate_tokens_from_size
    new: arian.domain.shared.tokenizer.estimate_tokens_from_size
    kind: function
    async: false
    result: int
    callers: [repository/filesystem/collector.py]

  - old: arian.domain.shared.security.validate_input_path
    new: arian.domain.shared.security.validate_input_path
    kind: function
    async: false
    result: "Result[SafePath]"
    callers: [application/validator.py]

  - old: arian.domain.shared.security.redact_secrets
    new: arian.domain.shared.security.redact_secrets
    kind: function
    async: false
    result: str
    callers: [application/orchestrator.py, service/builder/context_builder.py]

  - old: arian.domain.shared.security.sanitize_error_message
    new: arian.domain.shared.security.sanitize_error_message
    kind: function
    async: false
    result: str
    callers: [application/orchestrator.py, service/builder/context_builder.py]

  - old: arian.infrastructure.output_path_resolver.resolve_output_path
    new: arian.infrastructure.output_path_resolver.resolve_output_path
    kind: function
    async: false
    result: Path
    callers: [bootstrap/application.py]
