      kind: protocol_method
      async: false
      result: "list[str]"
      callers: [service/analyzer/python_analyzer.py]

    - old: LanguageAnalyzerProtocol.extract_public_api
      new: LanguageAnalyzerProtocol.extract_public_api
      kind: protocol_method
      async: false
      result: str
      callers: [service/analyzer/python_analyzer.py]

    - old: LanguageAnalyzerProtocol.compress
      new: LanguageAnalyzerProtocol.compress
      kind: protocol_method
      async: false
      result: str
      callers: [service/analyzer/python_analyzer.py, service/context/materializer.py]

    - old: LanguageAnalyzerProtocol.strip_comments
      new: LanguageAnalyzerProtocol.strip_comments
      kind: protocol_method
      async: false
      result: str
      callers: [service/analyzer/python_analyzer.py]

    - old: FileClassifierProtocol.classify
      new: FileClassifierProtocol.classify
      kind: protocol_method
      async: false
      result: "tuple[FileRole, int, CompressionLevel]"
      callers: [service/planner/context_planner.py]

    - old: FileClassifierProtocol.get_role
      new: FileClassifierProtocol.load_role
      kind: protocol_method
      async: false
      result: FileRole
      callers: []

    - old: ContextPlannerProtocol.plan
      new: ContextPlannerProtocol.plan
      kind: protocol_method
      async: false
      result: ContextPlan
      callers: [service/builder/context_builder.py]

    - old: ContextMaterializerProtocol.materialize
      new: ContextMaterializerProtocol.materialize
      kind: protocol_method
      async: false
      result: "tuple[MaterializedChunk, ...]"
      callers: [service/builder/context_builder.py]

    - old: OutputWriterProtocol.write
      new: OutputWriterProtocol.save
      kind: protocol_method
      async: false
      result: "Result[None]"
      callers: [application/orchestrator.py]

    - old: RendererProtocol.render
      new: RendererProtocol.render
      kind: protocol_method
      async: false
      result: "Result[str]"
      callers: [application/orchestrator.py]

