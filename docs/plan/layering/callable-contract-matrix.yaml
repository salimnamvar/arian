# Callable Contract Matrix — Canonical Operation Vocabulary
#
# This file is authoritative. Every production function/method is listed
# with its old name, new canonical name, and contract details.
# The vocabulary is: pure_transform | validate | execute | collect | load |
#   save | plan | materialize | render | map | notify | configure | initialize | close

# ── Canonical Vocabulary ──────────────────────────────────────────────
# execute:  One canonical entry point per operational module
# load:     Read/retrieve data (replaces get_*, fetch_*, read_*)
# save:     Persist/write data (replaces write_*, store_*, put_*)
# plan:     Decide what to include/process
# materialize: Transform plan decisions into concrete output
# render:   Produce final formatted output
# collect:  Gather/scan source data
# validate: Check preconditions
# map:      Transform one shape to another (replaces _row_to_*, convert_*)
# pure_transform: Stateless data transformation (no I/O)
# notify:   Report progress/events
# configure: Set up configuration
# initialize: One-time setup
# close:    Deterministic cleanup

# ── Domain Layer ──────────────────────────────────────────────────────
domain:
  protocols:
    - old: ContextBuilderProtocol.build
      new: ContextBuilderProtocol.execute
      kind: protocol_method
      async: true
      result: "Result[ContextPlan]"
      callers: [application/orchestrator.py]

    - old: ContextBuilderProtocol.load_content
      new: ContextBuilderProtocol.load
      kind: protocol_method
      async: true
      result: "Result[ContentLoadData]"
      callers: [application/orchestrator.py]

    - old: ContextBuilderProtocol.materialize
      new: ContextBuilderProtocol.materialize
      kind: protocol_method
      async: false
      result: "Result[tuple[MaterializedChunk, ...]]"
      callers: [application/orchestrator.py]

    - old: LanguageAnalyzerProtocol.extract_symbols
      new: LanguageAnalyzerProtocol.extract_symbols
      kind: protocol_method
      async: false
      result: "list[Symbol]"
      callers: [service/analyzer/python_analyzer.py]

    - old: LanguageAnalyzerProtocol.extract_imports
