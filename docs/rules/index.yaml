# Catalog of generalized engineering rules derived from practice.
# Each subject file is self-contained YAML; this index maps topics to files.

meta:
  id: rules-index
  title: Engineering rules catalog
  version: "2.1"
  location: docs/rules/
  purpose: >
    Capture architecture and coding lessons in a machine-readable,
    subject-oriented form. Rules are project-agnostic enough to reuse;
    examples may refer to this codebase but principles stand alone.

subjects:
  - id: csr-layering
    file: csr-layering.yaml
    title: CSR and layer separation
    tags: [architecture, imports, clean-architecture]

  - id: ports-and-protocols
    file: ports-and-protocols.yaml
    title: Ports and protocol-based DI
    tags: [di, protocols, ports]

  - id: composition-root
    file: composition-root.yaml
    title: Composition root and wiring
    tags: [bootstrap, di, lifecycle]

  - id: dry
    file: dry.yaml
    title: DRY and single ownership
    tags: [refactoring, duplication]

  - id: no-aliases
    file: no-aliases.yaml
    title: Canonical locations — no re-export shims
    tags: [imports, migration, api-surface]

  - id: naming
    file: naming.yaml
    title: Naming consistency
    tags: [style, protocols]

  - id: validation-ownership
    file: validation-ownership.yaml
    title: Validation ownership and error translation
    tags: [validation, errors, controller]

  - id: typing-contracts
    file: typing-contracts.yaml
    title: Typing contracts for ports and DTOs
    tags: [pyright, mypy, protocols]

  - id: safe-code
    file: safe-code.yaml
    title: Safe coding principles (overview)
    tags: [errors, flow-control, logging, robustness]

  - id: exit-and-raise
    file: exit-and-raise.yaml
    title: Single-exit point and zero-raise policy
    tags: [errors, flow-control, return]

  - id: b-continue
    file: b-continue.yaml
    title: Execution guard pattern
    tags: [flow-control, guard, state]

  - id: input-validation
    file: input-validation.yaml
    title: Input validation at function entry
    tags: [validation, types, nullability]

  - id: error-handling
    file: error-handling.yaml
    title: Localized error handling and exceptions
    tags: [errors, exceptions, try-catch]

  - id: logging-rules
    file: logging-rules.yaml
    title: Logging discipline and structured logging
    tags: [logging, correlation, sensitive-data]

  - id: function-design
    file: function-design.yaml
    title: Function design principles
    tags: [srp, purity, length, imports]

  - id: state-management
    file: state-management.yaml
    title: State management and determinism
    tags: [determinism, mutable-state, globals]

  - id: resource-ownership
    file: resource-ownership.yaml
    title: Resource ownership and lifecycle
    tags: [resources, context-managers, cleanup]

  - id: contracts
    file: contracts.yaml
    title: Function contracts and invariants
    tags: [preconditions, postconditions, assertions]

  - id: security-rules
    file: security-rules.yaml
    title: Security coding rules
    tags: [secrets, sql-injection, sanitization]

  - id: concurrency-rules
    file: concurrency-rules.yaml
    title: Concurrency and shared state
    tags: [threads, synchronization, data-races]

schema:
  common_fields:
    meta:
      required: [id, title, version, summary]
    rules:
      required: [id, principle, statement]
      optional: [do, dont, examples, enforce_with, related_rule, related_rules]

how_to_use:
  - Read index.yaml for the subject map
  - Open the subject file when reviewing PRs or scaffolding modules
  - Prefer adding a new subject file over bloating an existing one when the concern is orthogonal
  - Keep statements imperative and layer-agnostic; put project-specific names only in examples
  - When a rule references another, use related_rule instead of restating

session_origins:
  note: >
    Initial content distilled from architecture refactoring that moved
    ports and value objects into domain, removed infrastructure re-export
    shims, unified application pipelines and validation, and fixed
    protocol typing so the composition root type-checks without casts.
