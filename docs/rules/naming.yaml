# Naming and argument conventions
# Generalized lessons: consistent names for methods, args, attributes, ports.

meta:
  id: naming
  title: Naming consistency across modules and layers
  version: "2.1"
  related:
    - ports-and-protocols
    - csr-layering
  summary: >
    Names encode role and layer. The same concept uses the same identifier
    everywhere. The conventions below are generalized; projects may adopt
    their own prefix rules as long as they are consistent.

conventions:
  argument_prefix:
    rule: >
      Projects MAY adopt a consistent prefix for function/method parameters
      (e.g. ``a_``) to visually distinguish them from locals. If adopted,
      the prefix applies to all parameters except exemptions.
    exemptions:
      - self
      - cls
      - "*args / **kwargs bare names"
      - dunder methods (signatures required by Python protocols)
      - Framework public APIs (CLI option names) marked as exempt
    rationale: >
      Visual distinction between parameters and locals; grep-friendly
      call sites; uniform style across the codebase.

  private_attributes:
    rule: Injected collaborators and mutable state use a consistent prefix
    pattern: "_<role>"
    examples:
      - _builder
      - _renderer
      - _planner
    note: Type the attribute as the Protocol, not the concrete class

  protocols:
    pattern: "<Capability>Protocol"
    examples:
      - RendererProtocol
      - OutputWriterProtocol
      - BuilderProtocol
    dont:
      - Duplicate local Protocol with a different name for the same capability
      - Suffix implementations with Protocol

  value_objects:
    rule: Domain nouns; no layer prefix in the type name
    examples:
      - BuildRequest
      - CollectionStats
      - ContextPlan
    dont:
      - ServiceBuildRequest vs DomainBuildRequest for the same shape

  methods:
    pipeline_verbs:
      - collect
      - plan
      - load_content / load
      - materialize
      - render
      - write
      - validate
      - build
    note: >
      Same verb means same stage across layers; avoid synonyms
      (e.g. do not mix process/run/execute for the same stage).

rules:
  - id: name-001
    principle: Same concept, same name
    statement: >
      When a parameter appears in protocol, implementation, and caller,
      use the same argument name (including any project prefix).
    examples:
      - a_plan, a_content, a_root, a_request, a_path

  - id: name-002
    principle: Generalized mode parameters
    statement: >
      Shared helpers take generalized names (scope, output_path, paths,
      stats) rather than mode-specific aliases at the helper boundary.
    do:
      - Callers map local names into the shared helper's parameter list
    dont:
      - Three helper variants with near-identical signatures

  - id: name-003
    principle: Mapper names encode direction
    statement: >
      Private mappers use ``_row_to_<entity>`` / ``_entity_to_row`` style so
      intent is obvious without reading the body.

  - id: name-004
    principle: Avoid layer leakage in names
    statement: >
      Domain types do not include Infrastructure/Service in their names.
      Application DTOs may use Request/Result; domain uses Plan/File/Symbol.

  - id: name-005
    principle: Single-return style
    statement: >
      Functions assign to a result variable and return once (see
      exit-and-raise.exit-001). Names stay stable across branches
      (``result``, not early return of differently named values).
    related_rule: exit-and-raise.exit-001
