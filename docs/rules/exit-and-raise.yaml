# Single-exit and zero-raise policy
# Generalized lessons: every function returns from one place and raises nothing.

meta:
  id: exit-and-raise
  title: Single-exit point and zero-raise policy
  version: "2.0"
  related:
    - b-continue
    - error-handling
    - contracts
    - validation-ownership
  summary: >
    Every function contains exactly one return statement and zero raise
    statements. All code paths converge to that single return. Exceptions
    from external sources (disk, network, third-party libs) are caught
    locally and converted to structured results. Raises happen only at
    the application boundary (controllers, framework adapters) where
    domain results are translated to transport exceptions (CLI exit
    codes, HTTP errors). This enforces strict decoupling: functions
    never raise, application boundary raises for transport.

rules:
  - id: exit-001
    principle: Single-exit point
    statement: >
      Every function returns from exactly one place. All branches,
      including error paths, converge on a single `return` at the end.
    rationale: >
      Multiple exit points create invisible control flow. A reviewer must
      trace every path to understand what the function returns. A single
      exit makes the return value the function's explicit contract.
    do:
      - Assign to a result variable throughout the body; return once at the end
      - Use an execution guard to skip phases on failure, never early return
    dont:
      - Multiple `return` statements scattered across branches
      - "`return` inside exception handlers that bypasses the normal contract"
      - Early returns in the middle of a function body
    exceptions:
      - Python dunder methods mandated by the language data model
      - Generator functions (yield is a suspension, not an exit)
      - Async functions (await is not an exit)

  - id: exit-002
    principle: Zero-raise in functions
    statement: >
      Every function (in domain, application, service, repository,
      infrastructure) contains zero `raise` statements. External exceptions
      (IOError, NetworkError, TimeoutError, third-party library errors)
      are caught within the function and converted to a structured result.
      Functions never raise; they return.
    rationale: >
      Raising is a declaration that the function does not know how to
      handle its own errors. Functions that raise leak implementation
      concerns to their callers and break decoupling. Every external
      failure is converted to a Result at the point of detection with
      full contextual awareness.
    do:
      - Catch specific external exceptions and convert to Result.failure
      - Log the exception locally before returning the failure result
      - Return Result.failure(message) for all error conditions
    dont:
      - "`raise ValueError(...)` for input validation failures"
      - "`raise` for any condition the function can detect and handle"
      - Re-raise caught exceptions
      - Use exceptions for normal control flow
    exceptions:
      - Dunder methods and protocol-constrained interfaces mandated by Python

  - id: exit-003
    principle: Application boundary raises for transport
    statement: >
      The application boundary (controllers, CLI entry points, framework
      adapters) translates domain Result[T] into transport exceptions.
      This is the ONLY place where raise is used. The boundary catches
      Result.failure and raises the appropriate transport exception (CLI
      SystemExit, HTTP HTTPException, etc.).
    rationale: >
      Strict decoupling requires that functions never know about
      transport. The controller is the translation layer: it reads
      Result.is_success() and raises the transport-appropriate exception.
      This keeps domain/application/service code transport-agnostic.
    do:
      - Controller checks result.is_success(), raises SystemExit on failure
      - Framework adapters translate Result to HTTPException
    dont:
      - Functions raising transport-specific exceptions
      - Application/service code knowing about CLI exit codes or HTTP status

  - id: exit-004
    principle: Structured result return
    statement: >
      Every function that can fail returns a typed Result[T] with
      is_success, value, and message fields. Infallible pure functions
      return the direct type (see function-design.fd-005); a function
      is fallible when any parameter is untrusted, any I/O can fail,
      or any external dependency can error.
    rationale: >
      Result[T] couples callers to named fields instead of positional
      semantics and makes the failure path part of the contract. It is
      the single mechanism for conveying "operation succeeded with a
      value" versus "operation failed with a message".
    do:
      - Return Result.success(value) or Result.failure(message) for fallible functions
      - Use frozen dataclass for Result[T]
      - Return the direct type for infallible pure functions (parsers,
        formatters, pure computations) and document why they cannot fail
    dont:
      - Return (value, message) tuples
      - Return None silently on the happy path of a fallible function
      - Mix return-and-raise contracts across similar functions
    related_rule: function-design.fd-005

anti_patterns:
  - name: multiple returns
    description: >
      Scattered return statements make the function's output contract
      opaque and create invisible control flow.
    prefer: single return with result variable

  - name: raise-then-catch
    description: >
      Raising and immediately catching to choose between branches
      hides the real paths and makes single-exit impossible.
    prefer: execution guard for expected decisions

  - name: function-raises
    description: >
      A domain/application/service/repository function that raises
      breaks decoupling and leaks transport concerns.
    prefer: return Result.failure; let the controller boundary raise
