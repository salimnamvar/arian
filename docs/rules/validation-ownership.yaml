# Validation ownership and error translation
# Generalized lessons: who validates what, and how errors cross layers.

meta:
  id: validation-ownership
  title: Validation ownership and boundary translation
  version: "2.1"
  related:
    - csr-layering
    - dry
    - exit-and-raise
    - error-handling
  summary: >
    Business and security validation belong to application (or domain).
    Controllers and adapters only parse transport shapes and translate
    Result[T] to transport exceptions. Functions never raise; the
    controller is the sole raise site. Never maintain two independent
    validators for the same rules.

ownership:
  controller:
    validates:
      - Transport parseability (string to int, known enum tokens for UX)
      - Framework-level option constraints when they cannot be expressed later
    does_not_validate:
      - Path existence (unless purely for early UX, then must call application validator)
      - Budget maxima against domain limits
      - Scope membership against config tables (delegate)
      - Security/path traversal
    on_failure: >
      Reads Result.is_success() from application and raises transport
      exception (CLI SystemExit, HTTP HTTPException). This is the ONLY
      layer that raises. Functions never raise.
    raises:
      - SystemExit for CLI failures
      - HTTPException for HTTP failures
      - These are transport exceptions, not domain errors

  application:
    validates:
      - Path existence and traversal safety
      - Budget positivity and upper bounds
      - Scope membership
      - Group path sets with the same path rules as request paths
    returns:
      - Result.failure with InputError, SecurityError, or other domain messages
    does_not_raise: >
      Application returns Result.failure. It never raises. The controller
      translates Result to transport exceptions.

  domain:
    validates:
      - Aggregate invariants (e.g. plan internal consistency)
    returns:
      - Result.failure with domain-specific messages

  repository_and_infrastructure:
    validates:
      - Local I/O preconditions only (file readable at read time)
    does_not:
      - Reject whole requests for business rules already checked upstream
    catches:
      - IOError, NetworkError, TimeoutError, third-party exceptions
    returns:
      - Result.failure for all caught exceptions

rules:
  - id: val-001
    principle: Single validator for request DTOs
    statement: >
      One validator (in application) is the source of truth for request
      fields. Controllers call it; they do not fork the rules.

  - id: val-002
    principle: Symmetric field sets share helpers
    statement: >
      If two fields are lists of paths, both run through a single
      path validation helper.

  - id: val-003
    principle: Fast-fail UX may stay at the edge
    statement: >
      Controllers may pre-check enum names to print friendly valid-value
      lists, then still call the application validator for all other rules.
    note: Enum pre-check is presentation; limits and paths remain application-owned.

  - id: val-004
    principle: Exception translation at the boundary only
    statement: >
      Application returns Result.failure for all error conditions. It never
      raises. The controller reads Result.is_success() and raises the
      transport-appropriate exception — the only place where raise occurs
      for domain errors (see exit-and-raise.exit-003).
    do:
      - Application: return Result.failure(message)
      - "Controller: if not result.is_success(): raise SystemExit(result.message)"
    dont:
      - Application raising any exception
      - Controller reimplementing business validation instead of translating
      - Leaking absolute internal paths or secrets in error text
    related_rules:
      - exit-and-raise.exit-002
      - exit-and-raise.exit-003
      - error-handling.err-001

  - id: val-005
    principle: No silent skip of group or nested fields
    statement: >
      Nested structures must be covered by the same existence and security
      rules as top-level paths.

anti_patterns:
  - name: application-raises
    description: >
      Application layer raising exceptions breaks decoupling. The
      application is transport-agnostic; it returns Result, not raises.
    prefer: return Result.failure; let the controller translate
    related_rule: exit-and-raise.exit-002

  - name: duplicate-validation
    description: >
      Controller reimplementing the same validation rules that application
      already checks creates drift and maintenance burden.
    prefer: single validator in application; controller translates only
    related_rule: dry.dry-002
