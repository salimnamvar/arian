# Composition root and wiring
# Generalized lessons: where objects are created and how edges are injected.

meta:
  id: composition-root
  title: Composition root
  version: "1.0"
  related:
    - csr-layering
    - ports-and-protocols
  summary: >
    Exactly one composition root constructs concrete adapters and injects
    them into the application. No other layer is allowed to new-up the
    full graph.

rules:
  - id: wire-001
    principle: Single composition root
    statement: >
      Bootstrap (or equivalent) is the only module that imports both
      application and concrete service/repository/infrastructure types
      to assemble the graph.
    do:
      - "`create_application(config) -> Application`"
    dont:
      - Controllers constructing services or repositories directly

  - id: wire-002
    principle: All edge ports required
    statement: >
      Application constructor requires all edge capabilities: renderer,
      output writer, path resolver, builder, and security config. Defaults
      that import infrastructure defeat the root.
    do:
      - Bootstrap passes all resolvers explicitly
    dont:
      - Default arguments that import infrastructure inside the constructor body

  - id: wire-003
    principle: Config drives construction
    statement: >
      Tunables (limits, classifier tables, retry, renderer template dir)
      come from a loaded config object, not module-level constants in
      services.
    related_rule: csr-layering.csr-006

  - id: wire-004
    principle: Tests may rebuild the graph
    statement: >
      Unit tests may call the composition root or manually inject stubs.
      Manual injection must use the same protocol-typed constructor
      parameters as production.
    do:
      - Pass only the port being replaced when injecting a stub
    dont:
      - Partial constructors that omit required ports

  - id: wire-005
    principle: Lifecycle stays outside use cases
    statement: >
      Logging setup, async lifespan, and process-wide listeners are
      bootstrap/lifespan concerns; application code only uses getLogger.
