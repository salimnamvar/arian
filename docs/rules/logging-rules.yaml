# Logging rules
# Generalized lessons: log at detection layer, structured format, no sensitive data.

meta:
  id: logging-rules
  title: Logging discipline and structured logging
  version: "1.0"
  related:
    - error-handling
    - security-rules
  summary: >
    Failures are logged at the first layer that detects them. All log
    entries use structured format. Sensitive data never appears in
    logs. Every logical operation carries a correlation ID for
    end-to-end tracing.

rules:
  - id: log-001
    principle: Log at first detection layer
    statement: >
      A failure is logged at the first layer that detects it. Subsequent
      layers SHALL NOT re-log the same failure message. A higher layer
      may log only if it adds materially new diagnostic context (business
      transaction ID, user identity, compensating action).
    rationale: >
      Re-logging the same failure at multiple layers creates noise,
      obscures the actual failure point, and wastes storage.
    do:
      - Log the failure once with full context at the detection layer
    dont:
      - Re-log the same error message at every caller in the stack

  - id: log-002
    principle: Structured logging format
    statement: >
      All log entries use structured logging (JSON format or key=value).
      Each entry includes: timestamp (ISO 8601), level, correlation_id,
      function name, message, and additional context as key-value pairs.
    rationale: >
      Structured logs are machine-parseable. They enable automated
      alerting, aggregation, and analysis. Unstructured strings are
      unsearchable at scale.

  - id: log-003
    principle: No sensitive data in logs
    statement: >
      Log entries SHALL NOT contain passwords, API keys, tokens, secrets,
      PII, or any data classified as sensitive.
    rationale: >
      Logs are stored, transmitted, and accessed by multiple systems.
      Sensitive data in logs creates a data leak vector that bypasses all
      access controls on the source system.
    related_rule: security-rules.sec-001

  - id: log-004
    principle: Correlation ID propagation
    statement: >
      Every logical operation has a correlation ID. The ID is generated at
      the operation's entry point and propagated to all downstream function
      calls and log entries within that operation.
    rationale: >
      Without correlation IDs, tracing a single request across multiple
      function calls and log entries is impossible.

  - id: log-005
    principle: Log level discipline
    statement: >
      Log levels are used consistently:
      - DEBUG: detailed diagnostic information for developers, disabled in production
      - INFO: normal operation milestones (request received, operation completed)
      - WARNING: recoverable anomaly (operation succeeded but something unexpected)
      - ERROR: operation failed (function returned a failure result)
      - CRITICAL: system-level failure requiring immediate human attention
    rationale: >
      Incorrect log levels destroy signal-to-noise ratio. Warnings that
      should be errors hide real problems. Errors that should be warnings
      create alert fatigue.

anti_patterns:
  - name: re-logging
    description: >
      Logging the same error at every layer in the call stack creates noise
      and obscures the actual failure point.
    prefer: log once at the detection layer with full context

  - name: sensitive-data-in-logs
    description: >
      Including passwords, tokens, or PII in log entries creates data leak
      vectors across all systems that consume logs.
    prefer: scrub sensitive fields before logging
