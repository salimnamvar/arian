# Input validation rules
# Generalized lessons: validate every parameter at function entry, in all environments.

meta:
  id: input-validation
  title: Input validation at function entry
  version: "1.0"
  related:
    - b-continue
    - exit-and-raise
    - error-handling
    - contracts
  summary: >
    Every function validates all parameters before executing any business
    logic. Validation checks type, range, nullability, and domain-specific
    constraints. It runs in all environments including production, never
    gated behind debug or feature flags.

rules:
  - id: inv-001
    principle: Validate before use
    statement: >
      Every function validates all untrusted input before any business
      logic executes. Validation occurs at the function's entry point,
      not lazily at the point of first use.
    rationale: >
      Early validation prevents partially executed logic from leaving the
      system in an inconsistent state. It produces clearer error messages
      because the failure context is the function's entry.
    do:
      - Check all parameters at the top of the function body
      - Set the execution guard to False on validation failure
    dont:
      - Trust caller-provided values without a guard
      - Defer validation to deep internal points
    exceptions:
      - Values already validated by the immediate caller of a private
        helper (the helper documents that it relies on the caller's
        guarantee).

  - id: inv-002
    principle: Runtime checks match the documented contract
    statement: >
      Every function runtime-checks the parameters it does not fully
      trust, in the way its contract promises. Type hints are advisory;
      a caller passing an int where a str is expected will not fail
      without an explicit check.
    do:
      - isinstance() checks for values whose type the contract does not
        guarantee (CLI arguments, deserialized data, third-party output)
      - range, nullability, and membership checks for constrained values
    dont:
      - Rely solely on type annotations for safety at trust boundaries
    exceptions:
      - Functions receiving typed framework objects (Pydantic models,
        frozen dataclasses with __init__ validation) may rely on the
        framework, provided the reliance is documented in the function's
        contract.
      - Private helpers whose caller has already validated the value
        (see inv-001).
      - Protocol implementations whose parameter types are enforced by
        strict static typing against the same domain types (see
        typing-contracts.type-001).

  - id: inv-003
    principle: Range and constraint validation
    statement: >
      After type validation, validate domain-specific constraints: value
      ranges, string lengths, collection sizes, enum membership, regex
      patterns, and any business rule that constrains valid input.
    rationale: >
      Type validation alone is insufficient. A negative integer may be the
      wrong kind of valid input. Domain constraints are the second layer.

  - id: inv-004
    principle: Nullability validation
    statement: >
      Explicitly validate whether each parameter may be None. If a
      parameter is not nullable, check for None and return an error result.
    rationale: >
      None is Python's universal null. An unhandled None propagates
      through the codebase causing failures at distant, unrelated points.

  - id: inv-005
    principle: Validation runs in all environments
    statement: >
      Validation logic SHALL NOT be disabled by configuration flags,
      environment variables, or feature toggles. Validation runs in all
      environments without exception.
    rationale: >
      Disabling validation in production, where the stakes are highest,
      defeats its purpose entirely.

  - id: inv-006
    principle: No assert for validation
    statement: >
      The assert statement SHALL NOT be used for input validation or
      runtime checks. Asserts are stripped in optimized mode (python -O).
      Use explicit if-checks that return error results.
    rationale: >
      Using assert for validation means validation disappears in
      production when Python runs with -O. Runtime validation must use
      explicit checks.
    related_rule: contracts.ct-004

anti_patterns:
  - name: deferred validation
    description: >
      Checking a parameter deep inside the body instead of at entry makes
      the failure context unclear and may leave partial state.
    prefer: validate at the top of the function body

  - name: assert-for-validation
    description: >
      Using assert for input validation strips the check in optimized
      mode, creating a silent production gap.
    prefer: explicit if-check returning Result.failure
