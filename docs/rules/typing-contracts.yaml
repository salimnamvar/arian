# Typing contracts and protocol assignability
# Generalized lessons: keep protocols, implementations, and DTOs aligned.

meta:
  id: typing-contracts
  title: Typing contracts for ports and DTOs
  version: "2.1"
  related:
    - ports-and-protocols
    - no-aliases
    - naming
  summary: >
    Strict type checking is part of architecture enforcement. Protocol
    signatures, domain DTOs, and implementations must stay assignable
    without casts at the composition root.

rules:
  - id: type-001
    principle: Protocol parameters match implementation parameters
    statement: >
      For a class to implement a Protocol under strict checking, method
      parameters must be contravariant-compatible. Prefer exact domain
      types shared by both sides over `object` or `Any`.
    fail_example: |
      class BuilderProtocol(Protocol):
          async def build(self, a_request: object) -> Plan: ...

      class Builder:
          async def build(self, a_request: BuildRequest) -> Plan: ...
      # Builder is NOT assignable to BuilderProtocol
    pass_example: |
      # BuildRequest lives in domain; both Protocol and impl use it.
      async def build(self, a_request: BuildRequest) -> Plan: ...

  - id: type-002
    principle: Shared DTOs live with the contract
    statement: >
      If a protocol method accepts or returns a structured value used by
      multiple layers, that type is a domain (or ports) model, not a
      service-private class.
    do:
      - Move shared request/response/plan types to domain when application depends on them

  - id: type-003
    principle: Avoid TYPE_CHECKING only when it hides cycles
    statement: >
      Use `TYPE_CHECKING` imports for circular module graphs inside domain.
      Do not use it to paper over illegal cross-layer imports.
    note: >
      Runtime Protocol method bodies are ellipsis; deferred annotations
      plus TYPE_CHECKING keep domain packages importable.

  - id: type-004
    principle: Attribute types are ports
    statement: >
      Instance attributes holding collaborators are annotated with the
      Protocol type, even when bootstrap injects a concrete class.
    do:
      - "`self._builder: BuilderProtocol = a_builder`"
    dont:
      - Annotate as concrete class then cast for tests

  - id: type-005
    principle: Composition root must type-check without casts
    statement: >
      If wiring fails pyright/mypy, fix the protocol or DTO location;
      do not `# type: ignore` at the composition root.

  - id: type-006
    principle: Architecture tests complement type checks
    statement: >
      Import-boundary tests catch layer violations; type checkers catch
      contract mismatches. Both are required in CI for architecture work.
