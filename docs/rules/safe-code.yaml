# Safe coding overview
# This file is a thin entry point. Detailed rules live in dedicated files.

meta:
  id: safe-code
  title: Safe coding principles
  version: "2.0"
  summary: >
    Functions follow a disciplined shape: validate inputs, step through
    expected outcomes via an execution guard, catch only unexpected errors,
    and return exactly once with an explicit structured result. This file
    is the entry point for the safe-coding subject files; the full catalog
    and subject map live in index.yaml.

related_files:
  note: >
    See index.yaml for the canonical subject map and each subject's file.
    The dedicated safe-coding subjects are: exit-and-raise, b-continue,
    input-validation, error-handling, logging-rules, function-design,
    state-management, resource-ownership, contracts, security-rules,
    and concurrency-rules.

canonical_shape: >
  Every function follows this shape:
  1. Initialize result variable and execution guard = True
  2. Validate all inputs (input-validation.yaml)
  3. Execute business logic guarded by the flag (b-continue.yaml)
  4. Catch unexpected exceptions locally (error-handling.yaml)
  5. Log failures at detection layer (logging-rules.yaml)
  6. Return exactly once with Result[T] (exit-and-raise.yaml)
